server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # nginx solo hereda los add_header del nivel superior cuando un location no
    # define ninguno propio, por eso los headers de seguridad se repiten en cada
    # location que define su propio Cache-Control:
    #   X-Content-Type-Options: nosniff
    #   X-Frame-Options: SAMEORIGIN
    #   Referrer-Policy: strict-origin-when-cross-origin
    #   Permissions-Policy: camera=(), microphone=(), geolocation=()

    # Fallback SPA: todo lo que no es un archivo real sirve index.html
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        try_files $uri $uri/ /index.html;
    }

    # index.html nunca se cachea en el navegador: tras un redeploy los assets
    # hasheados cambian de nombre y un index viejo serviría URLs rotas.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # El manifest cambia con cada build: revalidarlo siempre contra el server.
    # nginx no trae `webmanifest` en su mime.types: forzamos un MIME JSON para
    # que el navegador lo acepte como manifest de la PWA.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # Legacy: la API del panel es cross-origin (panelipstream.cl) y ya no se
    # sirve desde este nginx; se mantiene por compatibilidad.
    location ~* /api/ {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # Assets hasheados: caché larga e inmutable
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # Service worker: siempre revalidarlo contra el server.
    location /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }
}
