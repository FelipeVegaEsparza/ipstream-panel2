<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a1a2e" />
    <title>Sin conexión · IPStream</title>
    <style>
      body {
        margin: 0;
        min-height: 100svh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0f1220;
        color: #f3f4f6;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      .card {
        text-align: center;
        padding: 32px;
        max-width: 400px;
        border-radius: 16px;
        background: #1a1a2e;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      .card h1 {
        font-size: 1.25rem;
        margin: 0 0 8px;
      }
      .card p {
        color: #9ca3af;
        margin: 0;
      }
      button {
        margin-top: 20px;
        padding: 10px 18px;
        border: none;
        border-radius: 6px;
        background: #6366f1;
        color: #fff;
        font-family: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Sin conexión</h1>
      <p>No tienes conexión a internet en este momento.</p>
      <button onclick="window.location.reload()">Reintentar</button>
    </div>
  </body>
</html>
