<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a1a2e" />
    <meta name="description" content="App PWA multi-tenant para radios y canales de TV de IPStream Panel" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- og-meta -->
    <title>IPStream PWA</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
      }
      /* Splash de carga: se muestra antes de que React monte y es reemplazado
         por la app. El plugin `ipstream-splash` rellena este bloque en build. */
      .app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #1a1a2e;
      }
      .app-splash__overlay {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        padding: 24px 32px;
      }
      .app-splash__logo {
        width: 320px;
        height: 320px;
        max-width: 80vw;
        max-height: 80vw;
        border-radius: 32px;
        object-fit: contain;
      }
      .app-splash__name {
        margin: 0;
        color: #fff;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        font-size: 1.1rem;
        font-weight: 600;
      }
      .app-splash__spinner {
        width: 32px;
        height: 32px;
        border: 3px solid rgba(255, 255, 255, 0.35);
        border-top-color: #fff;
        border-radius: 50%;
        animation: app-splash-spin 0.8s linear infinite;
      }
      @keyframes app-splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"><!-- app-splash --></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
