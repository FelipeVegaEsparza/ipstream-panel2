name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (default: latest)'
        required: false
        default: 'latest'

permissions:
  contents: read
  packages: write

# Cancelar runs anteriores si hay un push nuevo
concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # GitHub deprecó Node 20 en los runners (predeterminado ahora es Node 24).
    # Mientras el proyecto siga en Node 20 forzamos el uso de la versión "insecure"
    # para no recibir el warning. Eliminar cuando el proyecto migre a Node 22+.
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

    steps:
      # === 1. Checkout ===
      - name: Checkout
        uses: actions/checkout@v4

      # === 2. Setup Docker Buildx (para caché) ===
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # === 3. Login a GitHub Container Registry ===
      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # === 3b. Lowercase owner (Docker requiere minúsculas) ===
      - name: Lowercase registry owner
        id: owner
        run: echo "owner=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      # === 4. Extraer metadata (tags, labels) ===
      - name: Extract Docker metadata
        if: github.event_name == 'push'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.owner.outputs.owner }}/ipstream-panel
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      # === 5. Build + Push de la imagen ===
      - name: Build and push Docker image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache de layers de Docker para builds rápidos
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # NOTA: NO setear platforms — los runners ubuntu-latest ya son
          # linux/amd64 y especificar platform fuerza cross-compile con
          # emulation (qemu-binfmt), lo que duplica o triplica el tiempo
          # de build.

      # === 5b. Build + Push de video-encoder ===
      - name: Build and push video-encoder image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: ./streaming/video
          file: ./streaming/video/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.owner }}/ipstream-video-encoder:${{ github.sha }},ghcr.io/${{ steps.owner.outputs.owner }}/ipstream-video-encoder:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # === 6. Configurar SSH ===
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      # === 7. Add known hosts (evita el prompt de host key) ===
      - name: Add VPS to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true
          # También aceptamos el caso de host alias
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" 2>/dev/null | head -1 >> ~/.ssh/known_hosts || true

      # === 8. Determinar IMAGE_TAG ===
      - name: Determine image tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "value=${{ github.event.inputs.image_tag || 'latest' }}" >> $GITHUB_OUTPUT
          else
            echo "value=${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      # === 9. Verify image was pushed successfully ===
      # Si la imagen no está en el registry, falla acá con un mensaje claro
      # en vez de tirar un error genérico más adelante.
      - name: Verify image was pushed
        run: |
          docker pull ghcr.io/${{ steps.owner.outputs.owner }}/ipstream-panel:${{ steps.tag.outputs.value }} || {
            echo "❌ Image no encontrada en el registry."
            echo "   Esperado: ghcr.io/${{ steps.owner.outputs.owner }}/ipstream-panel:${{ steps.tag.outputs.value }}"
            exit 1
          }

      # === 10. Deploy al VPS via SSH ===
      - name: Run deploy script on VPS
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.value }}
          GITHUB_REPOSITORY_OWNER: ${{ steps.owner.outputs.owner }}
        run: |
          ssh -o StrictHostKeyChecking=accept-new ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "cd /opt/ipstream-panel && \
             IMAGE_TAG='${{ steps.tag.outputs.value }}' \
             GITHUB_REPOSITORY_OWNER='${{ steps.owner.outputs.owner }}' \
             GHCR_TOKEN='${{ secrets.GITHUB_TOKEN }}' \
             ./deploy/scripts/deploy.sh"

      # === 10. Health check post-deploy ===
      - name: Post-deploy health check
        run: |
          sleep 15
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "cd /opt/ipstream-panel && ./deploy/scripts/health-check.sh" || {
            echo "⚠ Health check remoto falló. Verificar manualmente."
            exit 1
          }

      # === 12. Notificar resultado (opcional: Slack/Discord) ===
      - name: Notify success
        if: success()
        run: |
          echo "✅ Deploy a producción exitoso"
          echo "URL: https://${{ secrets.VPS_HOST }}"
          echo "Tag: ${{ steps.tag.outputs.value }}"

      - name: Notify failure
        if: failure()
        run: |
          echo "❌ Deploy a producción FALLÓ"
          echo "Ver GitHub Actions para más detalles"
