name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (default: latest)'
        required: false
        default: 'latest'

permissions:
  contents: read
  packages: write

# Cancelar runs anteriores si hay un push nuevo
concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    # GitHub deprecó Node 20 en los runners (predeterminado ahora es Node 24).
    # Mientras el proyecto siga en Node 20 forzamos el uso de la versión "insecure"
    # para no recibir el warning. Eliminar cuando el proyecto migre a Node 22+.
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

    steps:
      # === 1. Checkout ===
      - name: Checkout
        uses: actions/checkout@v4

      # === 2. Setup Docker Buildx (para caché) ===
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # === 3. Login a GitHub Container Registry ===
      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # === 3b. Lowercase owner (Docker requiere minúsculas) ===
      - name: Lowercase registry owner
        id: owner
        run: echo "owner=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      # === 4. Extraer metadata (tags, labels) ===
      - name: Extract Docker metadata
        if: github.event_name == 'push'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.owner.outputs.owner }}/ipstream-panel
          tags: |
            # SHA corto (7 chars), igual al tag local que produce
            # docker/build-push-action. Sin format=short da SHA completo
            # (40 chars) que no existe localmente y el push falla.
            type=sha,prefix=,format=short
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      # === 5. Build + Push de la imagen ===
      # Separamos build (load local) de push (push explícito) para
      # diagnosticar si el push falla silenciosamente con la action
      # combinada.
      - name: Build Docker image (load local)
        if: github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          # Tags con prefijo del registry para que docker push los
          # encuentre localmente.
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # NOTA: NO setear platforms — los runners ubuntu-latest ya
          # son linux/amd64 y especificar la plataforma fuerza
          # cross-compile con qemu-binfmt, lo que duplica o triplica
          # el tiempo de build.

      - name: Login a GHCR (re-confirmar antes de push)
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image to registry
        if: github.event_name == 'push'
        run: |
          set -e
          # Verificar autenticación antes de pushear
          echo "🔐 Verificación de auth GHCR:"
          docker info 2>&1 | grep -i "username\|registry" | head -5 || true

          TAG_STRING='${{ steps.meta.outputs.tags }}'
          echo "📦 Tags a pushear:"
          echo "$TAG_STRING"

          PUSH_FAILED=0
          for tag in $TAG_STRING; do
            if [ -n "$tag" ]; then
              echo "  → push $tag (intento 1/3)"
              # Retry con backoff para errores transitorios de red o de GHCR.
              attempt=1
              max_attempts=3
              while [ $attempt -le $max_attempts ]; do
                if docker push "$tag" 2>&1 | tee /tmp/push.log; then
                  break
                fi
                attempt=$((attempt + 1))
                if [ $attempt -le $max_attempts ]; then
                  echo "  ⚠ Push falló. Reintento $attempt/$max_attempts en $((attempt * 5))s..."
                  sleep $((attempt * 5))
                fi
              done
              if [ $attempt -gt $max_attempts ]; then
                echo "❌ Push falló para: $tag después de $max_attempts intentos"
                echo "--- últimas líneas del log:"
                tail -20 /tmp/push.log
                PUSH_FAILED=1
              fi
            fi
          done

          if [ $PUSH_FAILED -eq 1 ]; then
            echo "❌ Uno o más pushes fallaron. Abortando."
            echo "Posibles causas:"
            echo "  - Token GITHUB_TOKEN inválido o expirado"
            echo "  - Permisos insuficientes en GHCR"
            echo "  - Problema transitorio de conectividad con ghcr.io"
            exit 1
          fi
          echo "  ✓ Imagen principal pusheada"

      # === 5b. Determinar IMAGE_TAG (antes del build de video-encoder que lo usa) ===
      # Usamos SHA corto (7 chars) para matchear el tag que produce el
      # build. Si fuera completo, el pull de verificación no encontraría
      # la imagen en el registry. Este step DEBE ir antes de cualquier
      # build que use steps.tag.outputs.value.
      - name: Determine image tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "value=${{ github.event.inputs.image_tag || 'latest' }}" >> $GITHUB_OUTPUT
          else
            echo "value=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
          fi
          echo "Tag para verificacion: $(cat $GITHUB_OUTPUT)"

      # === 5c. Build + Push de video-encoder ===
      - name: Build video-encoder image (load local)
        if: github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: ./streaming/video
          file: ./streaming/video/Dockerfile
          push: false
          load: true
          # Usamos SHA corto para matchear el push step (que también usa SHA corto).
          tags: ghcr.io/${{ steps.owner.outputs.owner }}/ipstream-video-encoder:${{ steps.tag.outputs.value }},ghcr.io/${{ steps.owner.outputs.owner }}/ipstream-video-encoder:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push video-encoder image to registry
        if: github.event_name == 'push'
        run: |
          set -e
          OWNER='${{ steps.owner.outputs.owner }}'
          # Usamos SHA corto para matchear el tag local que produce el build.
          SHA=$(echo '${{ github.sha }}' | cut -c1-7)
          docker push "ghcr.io/$OWNER/ipstream-video-encoder:$SHA"
          docker push "ghcr.io/$OWNER/ipstream-video-encoder:latest"
          echo "  ✓ Imagen video-encoder pusheada"

      # === 6. Configurar SSH ===
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

# === 7. Add known hosts (evita el prompt de host key) ===
      - name: Add VPS to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true
          # También aceptamos el caso de host alias
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" 2>/dev/null | head -1 >> ~/.ssh/known_hosts || true

      # === 9. Verify image was pushed successfully ===
      # Si la imagen no está en el registry, falla acá con un mensaje claro
      # en vez de tirar un error genérico más adelante.
      - name: Verify image was pushed
        run: |
          set -e
          IMG="ghcr.io/${{ steps.owner.outputs.owner }}/ipstream-panel:${{ steps.tag.outputs.value }}"
          echo "🔎 Pull de verificación: $IMG"
          docker pull "$IMG" || {
            echo "❌ Image no encontrada en el registry: $IMG"
            echo "   Imágenes locales que pudimos haber construido:"
            docker images | grep ipstream-panel || true
            exit 1
          }
          echo "  ✓ Imagen verificada en el registry"

      # === 9b. Validar secrets en .env del VPS ===
      # Falla rápido si los secrets son inseguros, antes de hacer el deploy.
      # El agente tiene un secret gate que aborta el arranque con tokens
      # de dev; mejor detectar esto acá.
      - name: Validate .env secrets on VPS
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "cd /opt/ipstream-panel && bash scripts/setup-prod.sh --check" || {
            echo "❌ El .env del VPS tiene secrets inseguros."
            echo "   Para solucionarlo desde el VPS:"
            echo "     ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
            echo "     cd /opt/ipstream-panel"
            echo "     bash scripts/setup-prod.sh --force"
            echo "     docker exec -i ipstream-app node - < scripts/rotate-stream-passwords.js"
            echo "     docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml up -d"
            exit 1
          }

      # === 10. Deploy al VPS via SSH ===
      - name: Run deploy script on VPS
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.value }}
          GITHUB_REPOSITORY_OWNER: ${{ steps.owner.outputs.owner }}
        run: |
          ssh -o StrictHostKeyChecking=accept-new ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "cd /opt/ipstream-panel && \
             IMAGE_TAG='${{ steps.tag.outputs.value }}' \
             GITHUB_REPOSITORY_OWNER='${{ steps.owner.outputs.owner }}' \
             GHCR_TOKEN='${{ secrets.GITHUB_TOKEN }}' \
             ./deploy/scripts/deploy.sh"

      # === 10. Health check post-deploy ===
      # Damos 45s para que la app y el agente terminen de arrancar.
      - name: Post-deploy health check
        run: |
          sleep 45
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "cd /opt/ipstream-panel && ./deploy/scripts/health-check.sh" || {
            echo "⚠ Health check remoto falló. Verificar manualmente."
            echo "   Para debug:"
            echo "     ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
            echo "     cd /opt/ipstream-panel"
            echo "     docker compose ps"
            echo "     docker logs ipstream-app --tail 30"
            echo "     docker logs ipstream-streaming-agent --tail 30"
            exit 1
          }

      # === 12. Notificar resultado (opcional: Slack/Discord) ===
      - name: Notify success
        if: success()
        run: |
          echo "✅ Deploy a producción exitoso"
          echo "URL: https://${{ secrets.VPS_HOST }}"
          echo "Tag: ${{ steps.tag.outputs.value }}"

      - name: Notify failure
        if: failure()
        run: |
          echo "❌ Deploy a producción FALLÓ"
          echo "Ver GitHub Actions para más detalles"
