# =====================================================
# IPStream Panel — docker-compose para desarrollo local
# =====================================================
# Servicios:
#   - db          MySQL 8.0
#   - app         Next.js (IPStream Panel)
#   - icecast     Servidor de streaming HTTP (audio)
#   - liquidsoap  Motor AutoDJ (Phase 0: 1 proceso de prueba)
#   - agent       Sidecar Node.js que controla icecast + liquidsoap
#
# Uso:
#   docker compose up -d --build
#   docker compose down              # detener
#   docker compose down -v           # detener y borrar volúmenes (reset)
# =====================================================

services:
  db:
    image: mysql:8.0
    container_name: ipstream-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secret_change_me}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ipstream_panel}
      MYSQL_USER: ${MYSQL_USER:-ipstream}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ipstream_secret}
      TZ: ${TZ:-UTC}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root_secret_change_me}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - ipstream-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ipstream-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      DATABASE_URL: mysql://${MYSQL_USER:-ipstream}:${MYSQL_PASSWORD:-ipstream_secret}@db:3306/${MYSQL_DATABASE:-ipstream_panel}?schema=public&charset=utf8mb4
      DB_HOST: db
      DB_PORT: 3306
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-dev-secret-change-me-in-prod-32chars-minimum}
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:?ENCRYPTION_KEY es requerida (generar con: openssl rand -hex 32)}"
      CRON_SECRET: ${CRON_SECRET:-}
      # Streaming agent
      STREAMING_AGENT_URL: ${STREAMING_AGENT_URL:-http://agent:4000}
      STREAMING_AGENT_TOKEN: ${STREAMING_AGENT_TOKEN:-dev-agent-token-change-me-in-prod}
      HARBOR_CALLBACK_SECRET: ${HARBOR_CALLBACK_SECRET:-dev-harbor-callback-token-change-me}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      ICE_PUBLIC_URL: ${ICE_PUBLIC_URL:-http://localhost:8000}
      ICE_PUBLIC_PORT: ${ICE_PUBLIC_PORT:-8000}
      HARBOR_PUBLIC_HOSTNAME: ${HARBOR_PUBLIC_HOSTNAME:-localhost}
      ICE_SOURCE_PASSWORD: ${ICE_SOURCE_PASSWORD:-hackme}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@ipstream.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123456}
      ADMIN_NAME: ${ADMIN_NAME:-Administrador Principal}
    ports:
      - "3000:3000"
    volumes:
      - app_uploads:/app/public/uploads
      # DEV: bind-mount del schema para reflejar cambios sin rebuild.
      # En prod esto se quita y se reconstruye la imagen.
      - ./prisma/schema.prisma:/app/prisma/schema.prisma:ro
    networks:
      - ipstream-net

  # =====================================================
  # Icecast 2 — servidor de streaming HTTP
  # Sirve streams en :8000 y expone admin API en /admin/
  # =====================================================
  icecast:
    build:
      context: ./streaming/icecast
      dockerfile: Dockerfile
    container_name: ipstream-icecast
    restart: unless-stopped
    environment:
      ICE_ADMIN_USER: ${ICE_ADMIN_USER:-admin}
      ICE_ADMIN_PASSWORD: ${ICE_ADMIN_PASSWORD:-hackme}
      ICE_SOURCE_PASSWORD: ${ICE_SOURCE_PASSWORD:-hackme}
      ICE_RELAY_PASSWORD: ${ICE_RELAY_PASSWORD:-hackme}
      ICE_HOSTNAME: ${ICE_HOSTNAME:-localhost}
    ports:
      - "8000:8000"     # listeners + admin (HTTP)
    volumes:
      - icecast_logs:/var/log/icecast2
    networks:
      - ipstream-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/status-json.xsl"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # =====================================================
  # Liquidsoap — motor AutoDJ
  # Phase 0: 1 proceso de prueba (sine wave o MP3 playlist)
  # En fases siguientes será supervisado por el streaming-agent
  # =====================================================
  liquidsoap:
    build:
      context: ./streaming/liquidsoap
      dockerfile: Dockerfile
    container_name: ipstream-liquidsoap
    restart: unless-stopped
    depends_on:
      icecast:
        condition: service_healthy
    environment:
      # Para debugging con `docker exec`
      - TERM=xterm
      # Token compartido con el agente para callbacks de harbor.
      # Debe coincidir con HARBOR_CALLBACK_SECRET del servicio agent.
      - HARBOR_CALLBACK_TOKEN=${HARBOR_CALLBACK_SECRET:-dev-harbor-callback-token-change-me}
    # Puerto harbor para DJ en vivo: se expone un rango.
    # Cada cliente usa puerto = liquidsoapTelnetPort + 10000 (default: 22340).
    # Ajustar HARBOR_PORT_RANGE según cantidad de clientes.
    ports:
      - "${HARBOR_PORT_RANGE:-22340-22350}:${HARBOR_PORT_RANGE:-22340-22350}"
    volumes:
      - ./streaming/liquidsoap/scripts:/etc/liquidsoap/scripts:ro
      # Fase 0: bind-mount desde un path dentro del proyecto.
      - ./data/radio:/var/lib/radio
      # Bind-mount al host. Antes era named volume "liquidsoap_logs" que el contenedor
      # liquidsoap (uid 100) no podía escribir si lo había tocado antes otro proceso
      # (permission denied al primer arranque). El deploy.sh hace chown 100:101.
      - ./data/logs/liquidsoap:/var/log/liquidsoap
    networks:
      - ipstream-net
    healthcheck:
      test: ["CMD", "liquidsoap", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # =====================================================
  # SRS — RTMP + HLS server para Televisión
  # =====================================================
  srs:
    image: ossrs/srs:5
    container_name: ipstream-srs
    # La imagen por defecto arranca con `-c conf/docker.conf`; nosotros
    # proveemos `conf/srs.conf`, así que fijamos el command explícitamente.
    command: ["./objs/srs", "-c", "conf/srs.conf"]
    restart: unless-stopped
    ports:
      - "1935:1935"       # RTMP
      - "8080:8080"       # HTTP API + HLS
    volumes:
      - ./streaming/srs/conf:/usr/local/srs/conf:ro
      - srs_hls:/usr/local/srs/objs/nginx/html
    networks:
      - ipstream-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/v1/versions"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # =====================================================
  # Video Encoder — FFmpeg para AutoDJ de Televisión
  # =====================================================
  video-encoder:
    build:
      context: ./streaming/video
      dockerfile: Dockerfile
    container_name: ipstream-video-encoder
    restart: unless-stopped
    # Rango de puertos para relays RTMP de DJs en vivo.
    # Cada cliente usa un puerto único dentro de este rango.
    # Ajustar RTMP_RELAY_PORT_RANGE_START y RTMP_RELAY_PORT_RANGE_END para
    # soportar más clientes simultáneos. Default: 300 puertos (1936-2235).
    ports:
      - "${RTMP_RELAY_PORT_RANGE_START:-1936}-${RTMP_RELAY_PORT_RANGE_END:-2235}:${RTMP_RELAY_PORT_RANGE_START:-1936}-${RTMP_RELAY_PORT_RANGE_END:-2235}"
    volumes:
      - ./data/video:/var/lib/video
      - video_logs:/var/log/video-encoder
    networks:
      - ipstream-net

  # =====================================================
  # Streaming Agent — sidecar Node.js + Fastify
  # Controla icecast + liquidsoap por cliente.
  # El IPStream Panel lo consume vía HTTP.
  # =====================================================
  agent:
    build:
      context: ./streaming/agent
      dockerfile: Dockerfile
    container_name: ipstream-streaming-agent
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      icecast:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      HOST: 0.0.0.0
      LOG_LEVEL: info
      # Auth
      STREAMING_AGENT_TOKEN: ${STREAMING_AGENT_TOKEN:-dev-agent-token-change-me-in-prod}
      HARBOR_CALLBACK_SECRET: ${HARBOR_CALLBACK_SECRET:-dev-harbor-callback-token-change-me}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      # Encryption (misma key que el panel)
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:?ENCRYPTION_KEY es requerida (generar con: openssl rand -hex 32)}"
      # DB
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER:-ipstream}
      DB_PASSWORD: ${MYSQL_PASSWORD:-ipstream_secret}
      DB_DATABASE: ${MYSQL_DATABASE:-ipstream_panel}
      # Icecast
      ICE_HOST: icecast
      ICE_PORT: 8000
      # Video relay RTMP (para DJs en vivo de TV)
      RTMP_RELAY_PORT_RANGE_START: ${RTMP_RELAY_PORT_RANGE_START:-1936}
      RTMP_RELAY_PORT_RANGE_END: ${RTMP_RELAY_PORT_RANGE_END:-2235}
      RTMP_RELAY_PUBLIC_HOST: ${RTMP_RELAY_PUBLIC_HOST:-localhost}
      ICE_ADMIN_USER: ${ICE_ADMIN_USER:-admin}
      ICE_ADMIN_PASSWORD: ${ICE_ADMIN_PASSWORD:-hackme}
      ICE_SOURCE_PASSWORD: ${ICE_SOURCE_PASSWORD:-hackme}
      ICE_RELAY_PASSWORD: ${ICE_RELAY_PASSWORD:-hackme}
      ICE_HOSTNAME: ${ICE_HOSTNAME:-localhost}
      HARBOR_PUBLIC_HOSTNAME: ${HARBOR_PUBLIC_HOSTNAME:-localhost}
      # Liquidsoap
      LIQUIDSOAP_BIN: /usr/bin/liquidsoap
      LIQUIDSOAP_SCRIPTS_PATH: /etc/liquidsoap/scripts
      LIQUIDSOAP_LOG_PATH: /var/log/liquidsoap
      LIQUIDSOAP_TELNET_BASE_PORT: 12340
      LIQUIDSOAP_HOST: ipstream-liquidsoap
      # Radio library
      RADIO_LIBRARY_PATH: /var/lib/radio
    ports:
      - "127.0.0.1:4000:4000"   # accesible solo desde el host (para debug)
    volumes:
      - ./data/radio:/var/lib/radio
      # El agent usa /var/log/liquidsoap solo como STRING (LIQUIDSOAP_LOG_PATH
      # se inyecta en el .liq que corre dentro del contenedor liquidsoap).
      # No necesita montar el dir; eso era una referencia huérfana.
      # Fase 1: montamos los scripts generados dinámicamente.
      # En prod, agent ejecutará liquidsoap vía docker exec en lugar de generar scripts.
      - ./streaming/liquidsoap/scripts:/etc/liquidsoap/scripts
      # Docker socket: necesario para que el agent pueda hacer `docker exec`
      # en el container de liquidsoap. En prod, restringir el acceso.
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - ipstream-net

networks:
  ipstream-net:
    driver: bridge

volumes:
  db_data:
    name: ipstream_db_data
  app_uploads:
    name: ipstream_uploads
  icecast_logs:
    name: ipstream_icecast_logs
  srs_hls:
    name: ipstream_srs_hls
  video_logs:
    name: ipstream_video_logs
  # liquidsoap_logs se reemplazó por bind-mount ./data/logs/liquidsoap en el
  # servicio `liquidsoap` arriba; mantenerlo como named rompía los logs.
