# =====================================================
# IPStream Panel — docker-compose.prod.yml
# =====================================================
# Override del docker-compose.yml para PRODUCCIÓN.
# Se usa con: docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml
#
# Diferencias vs dev:
#   - Imágenes pre-built (taggeadas, no :latest)
#   - Restart policy: always
#   - Caddy agregado para HTTPS automático
#   - Sin bind mounts de código fuente
#   - Sin puerto 3000 expuesto (Caddy hace de proxy)
# =====================================================

services:
  app:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-ipstream}/ipstream-panel:${IMAGE_TAG:-latest}
    container_name: ipstream-app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE}?schema=public&charset=utf8mb4
      DB_HOST: db
      DB_PORT: 3306
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      CRON_SECRET: ${CRON_SECRET:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME:-Administrador Principal}
      STREAMING_AGENT_URL: http://agent:4000
      STREAMING_AGENT_TOKEN: ${STREAMING_AGENT_TOKEN}
      ICE_PUBLIC_URL: ${ICE_PUBLIC_URL}
      HARBOR_PUBLIC_HOSTNAME: ${HARBOR_PUBLIC_HOSTNAME}
    volumes:
      - app_uploads:/app/public/uploads
      # No bind-mount schema.prisma en producción — la imagen ya lo trae
    networks:
      - ipstream-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    container_name: ipstream-caddy
    restart: always
    depends_on:
      - app
      - icecast
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - ipstream-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  agent:
    environment:
      NODE_ENV: production
      PORT: 4000
      HOST: 0.0.0.0
      LOG_LEVEL: info
      STREAMING_AGENT_TOKEN: ${STREAMING_AGENT_TOKEN}
      HARBOR_CALLBACK_SECRET: ${HARBOR_CALLBACK_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_DATABASE: ${MYSQL_DATABASE}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      ICE_HOST: icecast
      ICE_PORT: 8000
      ICE_ADMIN_USER: ${ICE_ADMIN_USER}
      ICE_ADMIN_PASSWORD: ${ICE_ADMIN_PASSWORD}
      ICE_SOURCE_PASSWORD: ${ICE_SOURCE_PASSWORD}
      ICE_RELAY_PASSWORD: ${ICE_RELAY_PASSWORD}
      ICE_HOSTNAME: ${ICE_HOSTNAME}
      # Conexión Universal (host público para la URL de ingesta relay)
      RTMP_RELAY_PUBLIC_HOST: ${RTMP_RELAY_PUBLIC_HOST}
      HARBOR_PUBLIC_HOSTNAME: ${HARBOR_PUBLIC_HOSTNAME}
      LIQUIDSOAP_BIN: /usr/bin/liquidsoap
      LIQUIDSOAP_SCRIPTS_PATH: /etc/liquidsoap/scripts
      LIQUIDSOAP_LOG_PATH: /var/log/liquidsoap
      LIQUIDSOAP_TELNET_BASE_PORT: 12340
      LIQUIDSOAP_HOST: ipstream-liquidsoap
      RADIO_LIBRARY_PATH: /var/lib/radio
    volumes:
      # Bind-mount al host para que los MP3 y covers persistan entre deploys
      # y sean fáciles de respaldar/migrar. El agent corre como uid 1001,
      # así que el deploy.sh hace chown antes de levantar containers.
      - ./data/radio:/var/lib/radio
      # Bind-mount para que liquidsoap pueda escribir sus logs con su uid (100:101).
      # Antes era named volume "liquidsoap_logs" propiedad de otro uid → permission denied.
      - ./data/logs/liquidsoap:/var/log/liquidsoap
      # Bind-mount a un dir FUERA del repo. En dev (base compose) se monta
      # ./streaming/liquidsoap/scripts al repo para inspección; en prod esto
      # sería destruido por `git reset --hard` en cada deploy. Por eso prod
      # override usa ./data/scripts (que NO está en git). El deploy.sh hace
      # chown al uid del agent y siembra los scripts seed.
      - ./data/scripts:/etc/liquidsoap/scripts
      - /var/run/docker.sock:/var/run/docker.sock
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  icecast:
    environment:
      ICE_ADMIN_USER: ${ICE_ADMIN_USER}
      ICE_ADMIN_PASSWORD: ${ICE_ADMIN_PASSWORD}
      ICE_SOURCE_PASSWORD: ${ICE_SOURCE_PASSWORD}
      ICE_RELAY_PASSWORD: ${ICE_RELAY_PASSWORD}
      ICE_HOSTNAME: ${ICE_HOSTNAME}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  liquidsoap:
    # Override del mount de scripts: en prod el agent escribe los .liq en
    # ./data/scripts (no en el repo), entonces liquidsoap debe leer de ahí.
    volumes:
      - ./data/scripts:/etc/liquidsoap/scripts:ro
      - ./data/radio:/var/lib/radio
      - ./data/logs/liquidsoap:/var/log/liquidsoap
    environment:
      - TERM=xterm
      - HARBOR_CALLBACK_TOKEN=${HARBOR_CALLBACK_SECRET}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  srs:
    image: ossrs/srs:5
    container_name: ipstream-srs
    # La imagen por defecto arranca con `-c conf/docker.conf`; nosotros
    # proveemos `conf/srs.conf`, así que fijamos el command explícitamente.
    command: ["./objs/srs", "-c", "conf/srs.conf"]
    restart: always
    ports:
      - "1935:1935"
      - "8080:8080"
    volumes:
      - ./streaming/srs/conf:/usr/local/srs/conf:ro
      - srs_hls:/usr/local/srs/objs/nginx/html
    networks:
      - ipstream-net

  video-encoder:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-ipstream}/ipstream-video-encoder:${IMAGE_TAG:-latest}
    container_name: ipstream-video-encoder
    restart: always
    volumes:
      - video_library:/var/lib/video
      - video_logs:/var/log/video-encoder
    networks:
      - ipstream-net

networks:
  ipstream-net:
    driver: bridge

volumes:
  app_uploads:
    name: ipstream_app_uploads
  caddy_data:
    name: ipstream_caddy_data
  caddy_config:
    name: ipstream_caddy_config
  # Los siguientes los definimos desde el compose principal,
  # pero los referenciamos explícitamente para que docker no cree
  # volumes nuevos al hacer override.
  db_data:
    name: ipstream_db_data
  icecast_logs:
    name: ipstream_icecast_logs
  # Los siguientes volúmenes se reemplazan por bind-mounts en el servicio
  # `agent` arriba; mantenerlos como named rompe la persistencia entre deploys.
  # Ver agent.volumes y el comentario histórico que dejamos al migrarlos.
  video_library:
    name: ipstream_video_library
  srs_hls:
    name: ipstream_srs_hls
