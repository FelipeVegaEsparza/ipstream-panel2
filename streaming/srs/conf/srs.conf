# =====================================================
# SRS Configuration — IPStream Television
# =====================================================
# RTMP server + HLS + HTTP hooks for DJ detection

listen 1935;
max_connections 200;

http_server {
    enabled on;
    listen 8080;
    dir ./objs/nginx/html;
}

# HTTP API para verificar streams/vhosts (v5 soporta el mismo puerto que http_server)
http_api {
    enabled on;
    listen 8080;
}

vhost __defaultVhost__ {
    # HLS output
    hls {
        enabled on;
        hls_path ./objs/nginx/html;
        # Fragmentos cortos (3s) para que el primer frame llegue rápido al
        # cambiar entre AutoDJ (app 'live') y OBS (app 'dj').
        hls_fragment 3;
        hls_window 18;
        # Dispose al terminar el publish: evita servir manifiestos stale (con
        # #EXT-X-ENDLIST) cuando se corta el AutoDJ/DJ; el player detecta 404.
        hls_dispose on;
        hls_ctx off;
    }

    # HTTP hooks to notify agent of DJ connects/disconnects
    http_hooks {
        # En SRS v5 el default es OFF: sin esto los callbacks nunca se disparan.
        enabled on;
        on_publish http://agent:4000/api/video/hooks/on-publish;
        on_unpublish http://agent:4000/api/video/hooks/on-unpublish;
    }
}
