# =====================================================
# SRS Configuration — IPStream Television
# =====================================================
# RTMP server + HLS + HTTP hooks for DJ detection

listen 1935;
max_connections 200;

# =====================================================
# WebRTC (consola web de radio)
# =====================================================
# El puerto UDP debe coincidir con el publicado en docker-compose y con
# el firewall del nodo. `candidate` debe ser la IP pública (no DNS).
# SRS_RTC_SERVER_LISTEN / CANDIDATE pueden sobreescribir estos valores.
rtc_server {
    enabled on;
    listen 8010;
    candidate $CANDIDATE;
}

http_server {
    enabled on;
    listen 8080;
    # CORS para HLS servido directo desde el nodo (player en dominio del panel).
    crossdomain on;
    dir ./objs/nginx/html;
}

# HTTP API para verificar streams/vhosts (v5 soporta el mismo puerto que http_server)
http_api {
    enabled on;
    listen 8080;
}

vhost __defaultVhost__ {
    # WebRTC: el navegador publica por WHIP y SRS lo republica como RTMP
    # en el app 'radio'. El agente toma ese RTMP y lo manda al harbor.
    rtc {
        enabled on;
        rtc_to_rtmp on;
    }

    # HLS output
    hls {
        enabled on;
        hls_path ./objs/nginx/html;
        # Fragmentos de 2s alineados al keyframe de 2s del canónico de TV
        # (GOP 60 @30fps). Con hls_wait_keyframe on el segmento dura
        # max(hls_fragment, gop); al ser ambos 2s los .ts salen parejos.
        hls_fragment 2;
        hls_window 12;
        hls_td_ratio 1.0;
        hls_wait_keyframe on;
        # Dispose al terminar el publish: evita servir manifiestos stale (con
        # #EXT-X-ENDLIST) al cortar el AutoDJ/DJ. En segundos (>= hls_window).
        hls_dispose 30;
        hls_ctx off;
    }

    # HTTP hooks to notify agent of DJ connects/disconnects
    http_hooks {
        # En SRS v5 el default es OFF: sin esto los callbacks nunca se disparan.
        enabled on;
        on_publish http://agent:4000/api/video/hooks/on-publish;
        on_unpublish http://agent:4000/api/video/hooks/on-unpublish;
    }
}
