schema: spec-driven
created: 2026-08-16
goal: Eliminar el tope rígido de 4 DJs por radio y hacer que el máximo de DJs sea configurable por Plan (Plan.maxDjs, entero), generar mounts dinámicamente hasta ese límite, permitir múltiples DJs simultáneos con el ciclo AutoDJ correcto y actualizar el Panel para que no use listas hardcodeadas de mounts. Sin breaking changes en APIs existentes.
